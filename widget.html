<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LimitTrack Widget</title>
    <style>
      :root {
        --accent: #3b82f6;
        --green: #22c55e;
        --amber: #f59e0b;
        --gray: #9ca3af;

        --panel-bg: rgba(255, 255, 255, 0.86);
        --panel-border: rgba(15, 23, 42, 0.08);
        --panel-shadow: 0 18px 44px rgba(15, 23, 42, 0.22), 0 2px 8px rgba(15, 23, 42, 0.12);
        --text-primary: #0f172a;
        --text-secondary: rgba(15, 23, 42, 0.56);
        --row-bg: rgba(255, 255, 255, 0.5);
        --row-bg-hover: rgba(255, 255, 255, 0.92);
        --row-open-bg: rgba(34, 197, 94, 0.1);
        --row-open-bg-hover: rgba(34, 197, 94, 0.16);
        --divider: rgba(15, 23, 42, 0.06);
        --btn-bg: rgba(15, 23, 42, 0.06);
        --btn-bg-hover: rgba(15, 23, 42, 0.12);
        --reveal: rgba(255, 255, 255, 0.5);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --panel-bg: rgba(30, 32, 38, 0.82);
          --panel-border: rgba(255, 255, 255, 0.09);
          --panel-shadow: 0 18px 44px rgba(0, 0, 0, 0.5), 0 2px 8px rgba(0, 0, 0, 0.3);
          --text-primary: rgba(255, 255, 255, 0.94);
          --text-secondary: rgba(255, 255, 255, 0.5);
          --row-bg: rgba(255, 255, 255, 0.04);
          --row-bg-hover: rgba(255, 255, 255, 0.09);
          --row-open-bg: rgba(34, 197, 94, 0.14);
          --row-open-bg-hover: rgba(34, 197, 94, 0.2);
          --divider: rgba(255, 255, 255, 0.07);
          --btn-bg: rgba(255, 255, 255, 0.08);
          --btn-bg-hover: rgba(255, 255, 255, 0.16);
          --reveal: rgba(255, 255, 255, 0.06);
        }
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: transparent;
        overflow: hidden;
        -webkit-user-select: none;
        user-select: none;
      }

      body {
        font-family: "Segoe UI Variable Display", "Segoe UI Variable Text", "Segoe UI", -apple-system,
          BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        display: flex;
        align-items: flex-start;
        justify-content: center;
        padding: 8px;
      }

      #panel {
        position: relative;
        width: 100%;
        max-width: 288px;
        border-radius: 20px;
        background: var(--panel-bg);
        border: 1px solid var(--panel-border);
        box-shadow: var(--panel-shadow);
        backdrop-filter: blur(24px) saturate(160%);
        -webkit-backdrop-filter: blur(24px) saturate(160%);
        overflow: hidden;
        opacity: 0;
        transform: translateY(-6px) scale(0.98);
        animation: panel-in 260ms cubic-bezier(0.22, 1, 0.36, 1) forwards;
      }

      @keyframes panel-in {
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      /* Fluent "reveal" glow that follows the cursor - subtle, Windows-11-flavored */
      #panel::before {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: radial-gradient(160px circle at var(--mx, 50%) var(--my, 0%), var(--reveal), transparent 60%);
        opacity: 0;
        transition: opacity 220ms ease;
        z-index: 0;
      }
      #panel.reveal::before {
        opacity: 1;
      }

      #header {
        -webkit-app-region: drag;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 11px 10px 11px 14px;
        position: relative;
        z-index: 1;
      }

      #header img {
        width: 16px;
        height: 16px;
        border-radius: 4px;
        -webkit-app-region: no-drag;
      }

      #header .title {
        font-size: 12.5px;
        font-weight: 600;
        color: var(--text-primary);
        letter-spacing: 0.1px;
        flex: 1;
        min-width: 0;
      }

      #header .summary {
        font-size: 11px;
        color: var(--text-secondary);
        font-weight: 500;
        white-space: nowrap;
      }

      .icon-btn {
        -webkit-app-region: no-drag;
        width: 22px;
        height: 22px;
        border-radius: 999px;
        border: none;
        background: var(--btn-bg);
        color: var(--text-secondary);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        padding: 0;
        transition: background 150ms ease, color 150ms ease, transform 150ms ease;
      }
      .icon-btn:hover {
        background: var(--btn-bg-hover);
        color: var(--text-primary);
      }
      .icon-btn:active {
        transform: scale(0.9);
      }
      .icon-btn svg {
        width: 12px;
        height: 12px;
      }

      #divider {
        height: 1px;
        background: var(--divider);
        margin: 0 12px;
        position: relative;
        z-index: 1;
      }

      #rows {
        position: relative;
        z-index: 1;
        padding: 6px;
        display: flex;
        flex-direction: column;
        gap: 2px;
      }

      .row {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 8px;
        border-radius: 14px;
        background: var(--row-bg);
        cursor: pointer;
        transition: background 160ms ease, transform 160ms ease;
      }
      .row:hover {
        background: var(--row-bg-hover);
        transform: translateY(-1px);
      }
      .row.is-open {
        background: var(--row-open-bg);
      }
      .row.is-open:hover {
        background: var(--row-open-bg-hover);
      }

      .avatar {
        position: relative;
        width: 32px;
        height: 32px;
        border-radius: 999px;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 12.5px;
        font-weight: 700;
        color: #fff;
      }

      .status-dot {
        position: absolute;
        right: -1px;
        bottom: -1px;
        width: 10px;
        height: 10px;
        border-radius: 999px;
        border: 2px solid var(--panel-bg);
      }
      .status-dot.open {
        background: var(--green);
      }
      .status-dot.soon {
        background: var(--amber);
      }
      .status-dot.locked {
        background: var(--gray);
      }

      .row-text {
        flex: 1;
        min-width: 0;
      }
      .row-name {
        font-size: 12.5px;
        font-weight: 600;
        color: var(--text-primary);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .row-sub {
        font-size: 10.5px;
        color: var(--text-secondary);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        margin-top: 1px;
      }

      .row-right {
        flex-shrink: 0;
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .countdown {
        font-variant-numeric: tabular-nums;
        font-size: 12px;
        font-weight: 700;
        white-space: nowrap;
      }
      .countdown.open {
        color: var(--green);
      }
      .countdown.soon {
        color: var(--amber);
      }
      .countdown.locked {
        color: var(--text-secondary);
      }

      .hit-btn {
        -webkit-app-region: no-drag;
        border: none;
        border-radius: 999px;
        background: var(--green);
        color: #fff;
        font-size: 10.5px;
        font-weight: 700;
        padding: 5px 9px;
        cursor: pointer;
        white-space: nowrap;
        transition: filter 150ms ease, transform 150ms ease;
      }
      .hit-btn:hover {
        filter: brightness(1.08);
      }
      .hit-btn:active {
        transform: scale(0.94);
      }

      #footer {
        position: relative;
        z-index: 1;
        padding: 2px 14px 12px;
      }
      #footer button {
        -webkit-app-region: no-drag;
        width: 100%;
        border: none;
        background: transparent;
        color: var(--accent);
        font-size: 11.5px;
        font-weight: 600;
        padding: 6px 0 0;
        cursor: pointer;
        text-align: center;
      }
      #footer button:hover {
        text-decoration: underline;
      }

      #empty {
        position: relative;
        z-index: 1;
        padding: 22px 16px 20px;
        text-align: center;
      }
      #empty .emoji {
        font-size: 22px;
        margin-bottom: 6px;
      }
      #empty .msg {
        font-size: 12px;
        color: var(--text-secondary);
        margin-bottom: 10px;
        line-height: 1.4;
      }
      #empty button {
        -webkit-app-region: no-drag;
        border: none;
        border-radius: 999px;
        background: var(--accent);
        color: #fff;
        font-size: 11.5px;
        font-weight: 700;
        padding: 7px 14px;
        cursor: pointer;
      }

      button:focus-visible,
      [tabindex]:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <div id="panel">
      <div id="header">
        <img src="icon.png" alt="" />
        <div class="title">LimitTrack</div>
        <div class="summary" id="summary-text"></div>
        <button class="icon-btn" id="open-main-btn" title="Open LimitTrack" aria-label="Open LimitTrack">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7" /><path d="M7 7h10v10" /></svg>
        </button>
        <button class="icon-btn" id="hide-widget-btn" title="Hide widget" aria-label="Hide widget">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18" /><path d="M6 6l12 12" /></svg>
        </button>
      </div>
      <div id="divider"></div>
      <div id="rows"></div>
      <div id="footer"></div>
      <div id="empty" style="display: none"></div>
    </div>
    <script src="widget.js"></script>
  </body>
</html>
