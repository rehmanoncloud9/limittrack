<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LimitTrack Widget</title>
    <link rel="stylesheet" href="typography.css" />
    <link rel="stylesheet" href="appearance.css" />
    <style>
      /* Desktop widget. Static paint only: no blur, animation or transition, so an idle widget costs nothing.
         The window is transparent, so the glass look is a translucent fill with a light edge; it does not
         blur the wallpaper (a page cannot blur what is behind its own window). */
      :root {
        --glass-a: 255 255 255 / 0.80; --glass-b: 214 226 252 / 0.70; --glass-edge: 255 255 255 / 0.72;
        --glass-shadow: 28 52 110 / 0.20; --glass-inset: 255 255 255 / 0.55;
        --well: 255 255 255 / 0.62; --tile: 255 255 255 / 0.78; --hair: 20 45 100 / 0.10;
        --wave-a: 120 150 255 / 0.30; --wave-b: 120 150 255 / 0.14;
        --dot-off: 92 104 125 / 0.45;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --glass-a: 44 52 74 / 0.82; --glass-b: 26 32 50 / 0.76; --glass-edge: 255 255 255 / 0.14;
          --glass-shadow: 0 0 0 / 0.45; --glass-inset: 255 255 255 / 0.10;
          --well: 255 255 255 / 0.08; --tile: 255 255 255 / 0.10; --hair: 255 255 255 / 0.10;
          --wave-a: 90 130 255 / 0.26; --wave-b: 90 130 255 / 0.12;
          --dot-off: 160 170 188 / 0.50;
        }
      }
      :root[data-theme="dark"] {
        --glass-a: 44 52 74 / 0.82; --glass-b: 26 32 50 / 0.76; --glass-edge: 255 255 255 / 0.14;
        --glass-shadow: 0 0 0 / 0.45; --glass-inset: 255 255 255 / 0.10;
        --well: 255 255 255 / 0.08; --tile: 255 255 255 / 0.10; --hair: 255 255 255 / 0.10;
        --wave-a: 90 130 255 / 0.26; --wave-b: 90 130 255 / 0.12;
        --dot-off: 160 170 188 / 0.50;
      }

      * { box-sizing: border-box; }
      [hidden] { display: none !important; }
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: transparent; overflow: hidden; -webkit-user-select: none; user-select: none; }
      body { padding: 8px; font-family: var(--font-ui); color: rgb(var(--ink)); line-height: 1.25; }
      button { border: 0; padding: 0; margin: 0; background: none; color: inherit; font: inherit; text-align: left; cursor: pointer; }
      button:focus-visible { outline: 2px solid rgb(var(--accent)); outline-offset: 2px; }
      svg { display: block; flex: none; }
      .drag { -webkit-app-region: drag; }
      .nodrag { -webkit-app-region: no-drag; }

      #panel {
        position: relative; overflow: hidden;
        border-radius: 22px;
        background: linear-gradient(150deg, rgb(var(--glass-a)), rgb(var(--glass-b)));
        border: 1px solid rgb(var(--glass-edge));
        box-shadow: 0 6px 18px rgb(var(--glass-shadow)), inset 0 1px 0 rgb(var(--glass-inset));
      }
      #panel[data-layout="standard"] { width: 288px; padding: 14px 14px 16px; }
      #panel[data-layout="compact"] { width: 184px; padding: 12px; border-radius: 20px; display: flex; align-items: center; gap: 10px; }
      #panel[data-layout="multi"] { width: 252px; padding: 6px 8px; }
      #panel[data-layout="message"] { width: 252px; padding: 16px; }

      .tile { display: grid; place-items: center; flex: none; border-radius: 14px; background: rgb(var(--tile)); color: rgb(var(--accent-ink)); box-shadow: 0 1px 3px rgb(var(--glass-shadow) / 0.5); }
      .tile .mono { font-weight: 700; font-size: 15px; }
      .dot { flex: none; width: 10px; height: 10px; border-radius: 50%; background: rgb(var(--dot-off)); }
      .dot.on { background: rgb(var(--dot-open)); box-shadow: 0 0 0 3px rgb(var(--dot-open) / 0.18); }
      .num { font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
      .nm { font-weight: 600; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
      .muted { color: rgb(var(--muted)); }

      /* standard */
      .hd { display: flex; align-items: center; gap: 9px; height: 28px; }
      .mark { display: grid; place-items: center; width: 26px; height: 26px; border-radius: 8px; color: #fff; background: linear-gradient(145deg, #4a8bff, #1f55e0); }
      .hd .ttl { flex: 1; min-width: 0; font-size: 17px; font-weight: 650; letter-spacing: -0.01em; }
      .gear { display: grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; color: rgb(var(--muted)); }
      .gear:hover { background: rgb(var(--well)); color: rgb(var(--ink)); }
      .picker { display: flex; align-items: center; gap: 10px; width: 100%; height: 40px; margin-top: 10px; padding: 0 12px 0 8px; border-radius: 14px; background: rgb(var(--well)); }
      .picker .tile { width: 26px; height: 26px; border-radius: 8px; box-shadow: none; background: transparent; }
      .picker .nm { flex: 1; min-width: 0; font-size: 16px; }
      .picker .chev { color: rgb(var(--muted)); }
      .stat { position: relative; z-index: 1; display: grid; grid-template-columns: auto 1fr; column-gap: 12px; align-items: center; width: 100%; margin-top: 10px; padding: 4px 2px 0; }
      .stat .dot { width: 12px; height: 12px; }
      .stat .num { font-size: 44px; line-height: 1.05; }
      .stat .sub { grid-column: 1 / -1; margin-top: 1px; font-size: 14.5px; color: rgb(var(--muted)); }
      .wave { position: absolute; right: -34px; bottom: -48px; width: 190px; height: 120px; border-radius: 50%; pointer-events: none;
        background: radial-gradient(ellipse at 45% 40%, rgb(var(--wave-a)), rgb(var(--wave-b)) 62%, transparent 63%); }

      /* compact */
      #panel[data-layout="compact"] .tile { width: 48px; height: 48px; }
      .cmeta { flex: 1; min-width: 0; display: block; padding: 2px 0; }
      .cmeta .nm { display: block; font-size: 15.5px; }
      .cmeta .row { display: flex; align-items: center; gap: 8px; margin-top: 2px; }
      .cmeta .num { font-size: 30px; line-height: 1.1; }

      /* multi-tool */
      .items { margin: 0; padding: 0; list-style: none; }
      .item { display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 5px 4px; }
      .item + .item { border-top: 1px solid rgb(var(--hair)); }
      .item .tile { width: 30px; height: 30px; border-radius: 9px; box-shadow: none; background: rgb(var(--well)); }
      .item .open { flex: 1; min-width: 0; display: flex; align-items: center; gap: 9px; align-self: stretch; }
      .item .nm { flex: 1; min-width: 0; font-size: 15px; font-weight: 550; }
      .item .num { font-size: 19px; min-width: 1.6ch; text-align: right; }

      /* messages */
      .msg-title { font-size: 15px; font-weight: 600; }
      .msg-body { margin-top: 3px; font-size: 13px; color: rgb(var(--muted)); }
      .msg-btn { margin-top: 12px; padding: 7px 14px; border-radius: 999px; background: rgb(var(--accent)); color: #fff; font-size: 13px; font-weight: 500; }
    </style>
  </head>
  <body>
    <!-- One small icon sprite; each tool's tile references it with <use>. -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
      <defs>
        <symbol id="i-layers" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83Z"/><path d="m22 17.65-9.17 4.16a2 2 0 0 1-1.66 0L2 17.65"/><path d="m22 12.65-9.17 4.16a2 2 0 0 1-1.66 0L2 12.65"/></symbol>
        <symbol id="i-code" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m16 18 6-6-6-6"/><path d="m8 6-6 6 6 6"/><path d="m14.5 4-5 16"/></symbol>
        <symbol id="i-spark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.8c.7 5 2.5 8.4 9.2 9.2-6.7.8-8.5 4.2-9.2 9.2-.7-5-2.5-8.4-9.2-9.2 6.7-.8 8.5-4.2 9.2-9.2Z"/></symbol>
        <symbol id="i-grid" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="7" height="7" x="3" y="3" rx="1.5"/><rect width="7" height="7" x="14" y="3" rx="1.5"/><rect width="7" height="7" x="14" y="14" rx="1.5"/><rect width="7" height="7" x="3" y="14" rx="1.5"/></symbol>
        <symbol id="i-clock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9.5"/><path d="M12 6.5V12l3.5 2"/></symbol>
        <symbol id="i-gear" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></symbol>
        <symbol id="i-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></symbol>
      </defs>
    </svg>
    <main id="panel" class="drag" role="group" aria-label="LimitTrack widget" hidden></main>
    <script src="preferences.js"></script>
    <script src="domain.js"></script>
    <script src="widget.js"></script>
  </body>
</html>
